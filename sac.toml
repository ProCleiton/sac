[session]
name = "sac"
notify_interval = 30
poke_stale_after = 120

[[agents]]
name = "leader"
command = "kimi"
args = ["--model", "esteira/k3"]
role = "leader"
prompt_file = "prompts/leader.md"

[[agents]]
name = "dev-1"
command = "opencode"
args = ["-m", "opencode-go/deepseek-v4-flash"]
role = "aux"
prompt_file = "prompts/dev.md"

[[agents]]
name = "auditor"
command = "kimi"
args = ["--model", "esteira/k3"]
role = "aux"
prompt_file = "prompts/auditor.md"

[[loops]]
name = "dev-review"
sequence = ["leader", "dev-1", "auditor"]
max_iterations = 3
